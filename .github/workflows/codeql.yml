# Static analysis via GitHub CodeQL for this repository itself.
#
# Free for public repositories; requires GitHub Advanced Security while this
# repository is private (Settings > Code security). Stamped apps get their own
# copy of this workflow from stamp/.github/workflows/codeql.yml.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # Private repositories additionally need actions:read — the CodeQL action calls
  # the workflow-runs API, which 403s ("Resource not accessible by integration")
  # after a successful analysis without it.
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (csharp)
    # Code scanning has to be enabled in repository settings, and on a private
    # repository that needs GitHub Advanced Security. Until then the analysis
    # itself succeeds but reporting fails, reddening CI for a setting rather than
    # a defect — so skip while private and start scanning on going public.
    # Remove this line to run it on a private repository that does have GHAS.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:csharp'
