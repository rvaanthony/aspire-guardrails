name: Release - Publish

# Tags a release-candidate branch and publishes a GitHub Release for it.
#
# The tag is the immutable artifact of record. Branches move; a tag protected by
# a "block deletions and updates" ruleset on refs/tags/v* does not. That is what
# makes "what is in production?" have one exact answer, and what lets any two
# releases be diffed directly on GitHub.
#
# Tag format is CalVer: vYYYY.MM.DD, with .1, .2 … appended for a second or third
# release on the same day.
#
# Run this with the branch selector pointed at the releases/* branch you cut with
# release-cut.yml.
#
# Before first use, add a ruleset over refs/tags/v* blocking deletions and
# updates. Without it the tag is publishable now and repointable later, which
# defeats the reason the tag rather than the branch is treated as the artifact.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as a pre-release (does not become 'Latest')."
        required: false
        default: false
        type: boolean
      tag:
        description: "Override the tag. Leave blank to derive CalVer from today."
        required: false
        type: string

permissions:
  contents: write
  # The ref guard reads the check runs on the commit being tagged.
  checks: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard the ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${GITHUB_REF#refs/heads/}"
          # Explicit refspec. The ancestry checks below compare against
          # origin/main, and a missing remote-tracking ref would otherwise make
          # `--is-ancestor` fail in a way that reads as "not an ancestor".
          git fetch origin +refs/heads/main:refs/remotes/origin/main --quiet

          # A release tag must describe code that has passed CI. Two accepted
          # shapes: a releases/* freeze point, or a commit already on main.
          # Loose feature branches are refused.
          if [[ "$ref" == releases/* ]]; then
            # Being named releases/something proves nothing on its own — unless a
            # ruleset restricts creation, any writer can push such a ref. Require
            # shared history with the trunk, then report the divergence so a
            # patched freeze point is visible in the release record rather than
            # silently tagged.
            if ! git merge-base origin/main HEAD >/dev/null 2>&1; then
              echo "::error::'$ref' shares no history with main."
              exit 1
            fi
            ahead=$(git rev-list --count origin/main..HEAD)
            if [ "$ahead" -gt 0 ]; then
              echo "'$ref' carries $ahead commit(s) not on main:"
              git log --oneline --no-decorate origin/main..HEAD
            else
              echo "'$ref' is contained in main."
            fi
          elif git merge-base --is-ancestor HEAD origin/main; then
            echo "Tagging '$ref', which is already merged to main."
          else
            echo "::error::'$ref' is neither a releases/* branch nor merged to \
          main. Cut a release branch first, or merge to main."
            exit 1
          fi

          # Verify CI passed on the exact commit being tagged. A branch ruleset
          # requiring a green check can be bypassed by the repository admin role,
          # so for an admin-pushed commit this is the only gate.
          #
          # Deliberately NOT keyed on a specific check name. Job names get
          # renamed and jobs get added, and a guard that silently stops finding
          # its check is worse than no guard. Instead: every check run on the
          # commit must have COMPLETED, none may have failed, and at least one
          # must have succeeded.
          #
          # It fails closed, so an in-flight run reads the same as a failed one.
          # That is the point — wait for CI rather than tagging on a guess.
          sha=$(git rev-parse HEAD)
          runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
            --jq '.check_runs')

          pending=$(jq -r '[.[] | select(.status != "completed") | .name] | join(", ")' <<<"$runs")
          if [ -n "$pending" ]; then
            echo "::error::commit $sha has check runs still in flight: $pending. \
          Wait for them, then re-run."
            exit 1
          fi

          # `skipped` and `neutral` are not failures: codeql.yml skips itself on a
          # private repository without Advanced Security, and that must not block
          # a release.
          failed=$(jq -r '[.[] | select(.conclusion
            | IN("failure", "cancelled", "timed_out", "action_required", "stale"))
            | "\(.name) (\(.conclusion))"] | join(", ")' <<<"$runs")
          if [ -n "$failed" ]; then
            echo "::error::commit $sha has failing check runs: $failed."
            exit 1
          fi

          ok=$(jq -r '[.[] | select(.conclusion == "success")] | length' <<<"$runs")
          if [ "$ok" -eq 0 ]; then
            echo "::error::commit $sha has no successful check run — CI has not \
          run on it at all. Push it to a branch that triggers build-and-test first."
            exit 1
          fi
          echo "Commit $sha has $ok successful check run(s) and no failures."

      - name: Resolve tag
        id: resolve
        env:
          TAG_OVERRIDE: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet

          override="$TAG_OVERRIDE"
          if [ -n "$override" ]; then
            tag="$override"
            # A tag off the documented CalVer shape would also fall outside a
            # refs/tags/v* immutability ruleset, making it repointable later. The
            # override selects a date; it does not opt out of the format.
            calver='^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'
            if [[ ! "$tag" =~ $calver ]]; then
              echo "::error::'$tag' is not CalVer (vYYYY.MM.DD, optionally .N). \
          Leave the override blank to derive it from today."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists, and release tags are immutable."
              exit 1
            fi
          else
            base="v$(date -u +%Y.%m.%d)"
            tag="$base"
            n=1
            # Same-day re-releases get a numeric suffix rather than clobbering.
            while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
              tag="${base}.${n}"
              n=$((n + 1))
            done
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - name: Create annotated tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag from ${GITHUB_REF#refs/heads/}"
          git push origin "$tag"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="$TAG"
          args=(--title "$tag" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "$tag" "${args[@]}"

          url=$(gh release view "$tag" --json url --jq .url)
          {
            echo "### Release published"
            echo ""
            echo "| Tag | Ref | Commit |"
            echo "|---|---|---|"
            echo "| [\`$tag\`]($url) | \`${GITHUB_REF#refs/heads/}\` | \`$(git rev-parse --short HEAD)\` |"
            echo ""
            echo "Notes were auto-generated from the PRs merged since the previous"
            echo "release. Point your production deploy at this tag."
          } >> "$GITHUB_STEP_SUMMARY"
